<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crypto RSI — Decision Session</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="page">
    <header>
      <h1>Decision session</h1>
      <p class="subtitle">RSI snapshot for a token and timeframe via <code>/api/session</code>.</p>
    </header>

    <form id="session-form" class="card">
      <label>
        Token
        <input name="token" type="text" placeholder="BTC" required autocomplete="off">
      </label>
      <label>
        Timeframe
        <select name="timeframe" required>
          <option value="15m">15m</option>
          <option value="1h" selected>1h</option>
          <option value="4h">4h</option>
          <option value="1d">1d</option>
        </select>
      </label>
      <label>
        Exchange <span class="optional">(optional)</span>
        <input name="exchange" type="text" placeholder="binance" autocomplete="off">
      </label>
      <button type="submit">Load session</button>
    </form>

    <section id="status" class="status" hidden></section>
    <section id="result" class="card result" hidden>
      <dl id="session-fields"></dl>
      <pre id="session-json" class="json"></pre>
    </section>

    <footer>
      <a href="/legacy/heatmap.html">Legacy token heatmap (archived)</a>
    </footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
